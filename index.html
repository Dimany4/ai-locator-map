<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Локатор — Карта</title>

  <!-- Leaflet (бесплатно, open-source) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; font-family: -apple-system, "Segoe UI", sans-serif; }
    .popup-content { font-size: 14px; line-height: 1.45; max-width: 240px; }
    .popup-content h3 { margin: 0 0 6px; font-size: 15px; }
    .popup-category { font-weight: 600; color: #007eed; margin: 4px 0; }
    .popup-content p { margin: 4px 0; }
    .popup-minus { color: #d32f2f; }
    .user-pin {
      width: 18px; height: 18px; border-radius: 50%;
      background: #2f7bf6; border: 3px solid #fff;
      box-shadow: 0 0 0 2px #2f7bf6, 0 2px 6px rgba(0,0,0,.4);
    }
    .place-pin {
      width: 26px; height: 26px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; background: #fff; border: 2px solid #e0473a;
      box-shadow: 0 1px 5px rgba(0,0,0,.35);
    }
    #hint {
      position: absolute; z-index: 1000; left: 50%; top: 12px; transform: translateX(-50%);
      background: rgba(0,0,0,.72); color: #fff; padding: 7px 14px; border-radius: 20px;
      font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .25s;
    }
    #hint.show { opacity: 1; }
  </style>
</head>
<body>

<div id="map"></div>
<div id="hint">Карта загружена</div>

<script>
  // ---------- Telegram WebApp ----------
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) tg.setHeaderColor('#2f7bf6');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#ffffff');
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }

  const hint = document.getElementById('hint');
  const showHint = (msg) => {
    hint.textContent = msg;
    hint.classList.add('show');
    setTimeout(() => hint.classList.remove('show'), 2200);
  };

  // ---------- Разбор параметров URL ----------
  const urlParams = new URLSearchParams(window.location.search);

  const userLat = parseFloat(urlParams.get('user_lat')) || 54.6934; // дефолт: Островец
  const userLng = parseFloat(urlParams.get('user_lng')) || 25.9610;
  const cityName = urlParams.get('city') || '';

  let placesData = [];
  try {
    placesData = JSON.parse(decodeURIComponent(urlParams.get('places') || '[]'));
    if (!Array.isArray(placesData)) placesData = [];
  } catch (e) {
    console.warn('Не удалось разобрать places:', e);
    placesData = [];
  }

  // ---------- Карта ----------
  const map = L.map('map', { zoomControl: true }).setView([userLat, userLng], 15);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  // ---------- Маркер пользователя (divIcon — без внешних картинок) ----------
  const userIcon = L.divIcon({
    className: '',
    html: '<div class="user-pin"></div>',
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });
  L.marker([userLat, userLng], { icon: userIcon })
    .addTo(map)
    .bindPopup('<b>Вы здесь 📍</b>' + (cityName ? '<br>' + cityName : ''));

  // ---------- Маркеры мест ----------
  const bounds = L.latLngBounds([[userLat, userLng]]);

  placesData.forEach(place => {
    const lat = parseFloat(place.lat);
    const lng = parseFloat(place.lng);
    if (isNaN(lat) || isNaN(lng)) return;

    const icon = place.icon || '📍';
    const placeIcon = L.divIcon({
      className: '',
      html: '<div class="place-pin">' + icon + '</div>',
      iconSize: [30, 30],
      iconAnchor: [15, 15]
    });

    const marker = L.marker([lat, lng], { icon: placeIcon }).addTo(map);
    bounds.extend([lat, lng]);

    const popup = `
      <div class="popup-content">
        <h3>${escapeHtml(place.name || 'Без названия')}</h3>
        ${place.category ? `<p class="popup-category">💡 ${escapeHtml(place.category)}</p>` : ''}
        ${place.hack ? `<p><b>Лайфхак:</b> ${escapeHtml(place.hack)}</p>` : ''}
        ${place.minus ? `<p class="popup-minus">⚠️ ${escapeHtml(place.minus)}</p>` : ''}
        <p>
          <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=18/${lat}/${lng}" target="_blank">Открыть в OSM</a>
          &nbsp;·&nbsp;
          <a href="https://yandex.ru/maps/?pt=${lng},${lat}&z=18&l=map" target="_blank">Яндекс</a>
        </p>
      </div>`;
    marker.bindPopup(popup);
  });

  // ---------- Подгонка вида ----------
  if (placesData.length > 0) {
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 17 });
    showHint('Найдено мест: ' + placesData.length);
  } else {
    showHint('Точки не переданы');
  }

  // ---------- Утилиты ----------
  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Сообщаем Telegram, что карта готова
  if (tg) tg.MainButton.hide();
</script>
</body>
</html>
