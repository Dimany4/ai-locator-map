<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Локатор — Демо</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    body, html, #map { margin: 0; padding: 0; width: 100%; height: 100%; font-family: sans-serif; }
    .popup-content { font-size: 14px; line-height: 1.45; max-width: 240px; }
    .popup-content h3 { margin: 0 0 6px; font-size: 15px; }
    .popup-category { font-weight: 600; color: #007eed; margin: 4px 0; }
    .popup-minus { color: #d32f2f; }
    .user-pin { width: 18px; height: 18px; border-radius: 50%; background: #2f7bf6;
                border: 3px solid #fff; box-shadow: 0 0 0 2px #2f7bf6; }
    .place-pin { width: 26px; height: 26px; border-radius: 50%; display: flex;
                 align-items: center; justify-content: center; font-size: 15px;
                 background: #fff; border: 2px solid #e0473a; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  // ДЕМО: имитация данных, которые бот передаёт через URL-параметры
  const DEMO = {
    userLat: 54.6934,
    userLng: 25.9610,
    places: [
      { name: 'ТЦ Ostrovets Mall', lat: 54.6951, lng: 25.9642, category: 'Общедоступные',
        hack: 'Туалет на 2 этаже у фудкорта, вход свободный', icon: '🚾' },
      { name: 'McDonald\'s', lat: 54.6925, lng: 25.9588, category: 'Сетевой фастфуд',
        hack: 'Код на двери — спросите на кассе или возьмите чек', minus: 'Очередь в обед', icon: '🍔' },
      { name: 'Hotel Grand', lat: 54.6908, lng: 25.9665, category: 'Скрытые лобби',
        hack: 'Лобби налево от ресепшн, пройти уверенным шагом', icon: '🏨' },
      { name: 'Кафе «Раф»', lat: 54.6963, lng: 25.9571, category: 'Мелкие кафе/бары',
        hack: 'Купить эспрессо (~2 BYN) — туалет для гостей', icon: '☕' },
    ],
  };

  const map = L.map('map').setView([DEMO.userLat, DEMO.userLng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  L.marker([DEMO.userLat, DEMO.userLng], {
    icon: L.divIcon({ className: '', html: '<div class="user-pin"></div>', iconSize: [24, 24], iconAnchor: [12, 12] })
  }).addTo(map).bindPopup('<b>Вы здесь 📍</b>');

  const bounds = L.latLngBounds([[DEMO.userLat, DEMO.userLng]]);
  DEMO.places.forEach(p => {
    bounds.extend([p.lat, p.lng]);
    L.marker([p.lat, p.lng], {
      icon: L.divIcon({ className: '', html: `<div class="place-pin">${p.icon || '📍'}</div>`,
                        iconSize: [30, 30], iconAnchor: [15, 15] })
    }).addTo(map).bindPopup(`
      <div class="popup-content">
        <h3>${p.name}</h3>
        <p class="popup-category">💡 ${p.category}</p>
        <p><b>Лайфхак:</b> ${p.hack}</p>
        ${p.minus ? `<p class="popup-minus">⚠️ ${p.minus}</p>` : ''}
      </div>`);
  });
  map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
</script>
</body>
</html>
